{% if can_receive_adoption_requests %}<a data-request-audience="institution" class="{% if institution_unread_count %}has-updates{% endif %}" href="{% url 'adoption_interest_list' %}">Solicitudes recibidas <span class="request-unread-badge" {% if not institution_unread_count %}hidden{% endif %} aria-live="polite" aria-label="{{ institution_unread_count }} solicitudes con novedades">{{ institution_unread_count }} nueva{{ institution_unread_count|pluralize:"s" }}</span></a>{% endif %}
<a data-request-audience="applicant" class="{% if applicant_unread_count %}has-updates{% endif %}" href="{% url 'my_adoption_interests' %}">Mis solicitudes <span class="request-unread-badge" {% if not applicant_unread_count %}hidden{% endif %} aria-live="polite" aria-label="{{ applicant_unread_count }} solicitudes con novedades">{{ applicant_unread_count }} nueva{{ applicant_unread_count|pluralize:"s" }}</span></a>

{% extends "base.html" %}
{% block title %}Nuevo registro clínico · AppCanina{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">{{ patient.name }}</p><h1>Nuevo registro clínico</h1><p>Guardá el motivo de atención y las observaciones relevantes.</p></div></div>
<form method="post" class="single-form">{% csrf_token %}<section class="card"><h2>Atención</h2>{{ form.as_p }}</section><div class="form-actions"><a href="{% url 'patient_detail' patient.id %}">Cancelar</a><button>Guardar registro</button></div></form>
{% endblock %}
